{% load versioned_static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0B0F14">
<title>ChurchCast Control — {{ room_code }}</title>
<link rel="stylesheet" href="{% staticver 'presentation/css/fonts.css' %}">
<!-- The shared presentation design system. Loaded here too so the Style tab's
     live preview renders through exactly the rules the wall uses, instead of a
     second copy of them. Only projected text is affected — the controller
     chrome below is all .cc-* and stays phone-sized. -->
<link rel="stylesheet" href="{% staticver 'presentation/css/presentation.css' %}">
<link rel="stylesheet" href="{% staticver 'presentation/css/app.css' %}">
</head>
<body>
<div class="cc-ctrl" id="app">

  <!-- Top bar -->
  <div class="cc-top">
    <span class="cc-top__room">{{ room_code }}</span>
    <span class="cc-top__status">
      <span class="cc-top__dot" id="statusDot"></span>
      <span id="statusText">Connecting…</span>
    </span>
    <span class="cc-top__title" id="liveTitle">—</span>
  </div>

  <!-- Live preview. Tap anywhere on this box to collapse/expand it;
       collapsed reclaims ~230px of panel space mid-service. -->
  <div class="cc-preview" id="previewBox">
    <div class="cc-preview__peek" id="previewPeek">
      <span class="cc-preview__peek-dot" id="peekDot"></span>
      <span class="cc-preview__peek-text" id="previewPeekText">…</span>
      <span class="cc-preview__peek-hint">tap to expand</span>
    </div>
    <div class="cc-preview__canvas" id="previewCanvas">
      <div class="cc-preview__label" id="previewLabel">No content</div>
      <div class="cc-preview__ref" id="previewRef"></div>
      <div class="cc-preview__text" id="previewText"></div>
      <img class="cc-preview__img" id="previewImg" style="display:none">
      <div class="cc-preview__countdown-label" id="countdownLabel" style="display:none"></div>
      <div class="cc-preview__countdown" id="countdownDisplay" style="display:none">0:00</div>
    </div>
    <div class="cc-preview__meta">
      <span class="cc-preview__slide-num" id="slideNum">0 / 0</span>
      <span class="cc-preview__trans" id="previewTrans"></span>
      <span class="cc-preview__section-label" id="sectionLabel"></span>
    </div>
  </div>

  <!-- Tabs -->
  <div class="cc-tabs" id="tabs">
    <button class="cc-tab active" data-tab="queue">Queue</button>
    <button class="cc-tab" data-tab="library">Library</button>
    <button class="cc-tab" data-tab="songs">Songs</button>
    <button class="cc-tab" data-tab="scripture">Scripture</button>
    <button class="cc-tab" data-tab="images">Images</button>
    <button class="cc-tab" data-tab="announcements">Announcements</button>
    <button class="cc-tab" data-tab="style">Style</button>
  </div>

  <!-- Scrollable panel -->
  <div class="cc-panel" id="panel"></div>

  <!-- Fixed broadcast dock: Find + slide strip + Prev/Blank/Next + queue nav -->
  <div class="cc-dock">
    <div class="cc-dock__find">
      <button class="cc-findbtn" id="findBtn" type="button">
        <span class="cc-findbtn__icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg></span>
        <span class="cc-findbtn__text">Find song, verse, announcement…</span>
        <kbd class="cc-findbtn__kbd">/</kbd>
      </button>
    </div>
    <div class="cc-slides" id="slideStrip" style="display:none"></div>
    <div class="cc-nav">
      <button class="cc-nav__prev" id="prevBtn">◀ <span>Prev</span></button>
      <button class="cc-nav__blank" id="blankBtn">BLANK</button>
      <button class="cc-nav__next" id="nextBtn"><span>Next</span> ▶</button>
    </div>
    <div class="cc-navhint" id="navHint" hidden>Last slide</div>
    <div class="cc-qnav">
      <button class="cc-qnav__btn cc-qnav__btn--item" id="qPrev" title="Previous service item">
        <span class="cc-qnav__arrow">◀</span>
        <span class="cc-qnav__label"><span class="lbl-long">Prev item</span><span class="lbl-short">Item</span></span>
        <span class="cc-qnav__target" id="qPrevTitle"></span>
      </button>
      <span class="cc-qnav__pos" id="qPos">Service —</span>
      <button class="cc-qnav__btn cc-qnav__btn--item" id="qNext" title="Next service item">
        <span class="cc-qnav__target" id="qNextTitle"></span>
        <span class="cc-qnav__label"><span class="lbl-long">Next item</span><span class="lbl-short">Item</span></span>
        <span class="cc-qnav__arrow">▶</span>
      </button>
      <button class="cc-qnav__btn cc-qnav__btn--cd" id="cdBtn" title="Countdown timer">⏱ 10:00</button>
    </div>
  </div>

</div>

<!-- Quick Find: one input across songs, scripture, announcements, images, queue -->
<div class="cc-find" id="findRoot" hidden>
  <div class="cc-find__sheet" role="dialog" aria-label="Find content">
    <div class="cc-find__bar">
      <input class="cc-input" id="findInput" placeholder="Find song, verse, announcement…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="cc-find__close" id="findClose" aria-label="Close find"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="cc-find__results" id="findResults"></div>
  </div>
</div>

<!-- Modal container -->
<div id="modalRoot"></div>

<!-- Toast (scripture errors etc.) -->
<div id="toast" class="cc-toast" role="alert"></div>

<script>
window.ROOM_CODE = "{{ room_code }}";
window.HOST = "{{ host }}";
</script>
<script src="{% staticver 'presentation/js/scripture-picker.js' %}"></script>
<script src="{% staticver 'presentation/js/song-slides.js' %}"></script>
<script src="{% staticver 'presentation/js/control.js' %}"></script>
</body>
</html>
